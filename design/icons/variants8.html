<script>

  { id: 'r2b', name: 'R2b · 环身拔丝', desc: '环身在顶端被「拔」起一道水丝，收拢成滴——水面张力拉起的瞬间，交融感最强、形态最有机。' },

const grid = document.getElementById('grid');

    <div class="card${v.ref ? ' ref' : ''}">
      <h2>${v.name}</h2>
      <p class="desc">${v.desc}</p>

          <div class="row light"><span class="lbl">浅底</span>${rowImgs()}</div>
          <div class="row dark"><span class="lbl">深底</span>${rowImgs()}</div>
        </div>

    </div>`);
