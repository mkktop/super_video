  { id: 's1c', name: 'S1c · 触水涟漪', desc: '水面下移到环的下三分之一，播放键的底角刚好点在水面上，荡出两圈椭圆涟漪——播放键与水面有了互动。' },

];

const sizes = [64, 48, 32, 24, 16];
const grid = document.getElementById('grid');
for (const v of variants) {
  const rowImgs = () => sizes.map(s =>
    `<svg width="${s}" height="${s}" style="border-radius:${Math.max(3, s * 0.22)}px"><use href="#${v.id}"/></svg>`
  ).join('');
  grid.insertAdjacentHTML('beforeend', `
    <div class="card${v.ref ? ' ref' : ''}">
      <h2>${v.name}</h2>
      <p class="desc">${v.desc}</p>
      <div class="stage">
        <div class="big"><svg viewBox="0 0 512 512"><use href="#${v.id}"/></svg></div>
        <div class="sizes">
          <div class="row light"><span class="lbl">浅底</span>${rowImgs()}</div>
          <div class="row dark"><span class="lbl">深底</span>${rowImgs()}</div>
        </div>
      </div>
    </div>`);
}
