<p class="group s" data-page-node-id="dxBA8eMoAvpbHNvbzXOn51">浸泡系 · 圆环沉在水下</p>
<div class="grid" id="gridS" data-page-node-id="dC7iHBrlm9HBb45KvOg9SF"></div>

<script>
// ---- 生成类图元 ----
// M1 径向均衡器
(function () {
  const g = document.getElementById('eqBars');
  const N = 56, r0 = 120;
  const stops = [[34, 211, 238], [167, 139, 250], [255, 92, 138]]; // 青→紫→粉
  const lerp = (a, b, t) => a + (b - a) * t;
  function triColor(p) {
    const seg = p * (stops.length - 1), i = Math.min(Math.floor(seg), stops.length - 2), t = seg - i;
    const c = stops[i].map((v, k) => Math.round(lerp(v, stops[i + 1][k], t)));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  let s = '';
  for (let i = 0; i < N; i++) {
    const t = i / N * Math.PI * 2;
    const h = 15 + 20 * Math.abs(Math.sin(3 * t)) + 7 * Math.sin(7 * t + 1.3);
    const x1 = 256 + r0 * Math.cos(t), y1 = 256 + r0 * Math.sin(t);
    const x2 = 256 + (r0 + h) * Math.cos(t), y2 = 256 + (r0 + h) * Math.sin(t);
    s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
      stroke="${triColor(i / N)}" stroke-width="8" stroke-linecap="round"/>`;
  }
  g.innerHTML = s;
})();

// 波形圆工具
function wavePath(cx, cy, r, amp, freq, phase) {
  let d = '';
  const N = 240;
  for (let i = 0; i <= N; i++) {
    const t = i / N * Math.PI * 2;
    const rr = r + amp * Math.sin(freq * t + phase);
    d += (i ? 'L' : 'M') + (cx + rr * Math.cos(t)).toFixed(1) + ' ' + (cy + rr * Math.sin(t)).toFixed(1);
  }
  return d + 'Z';
}
document.getElementById('wave1').setAttribute('d', wavePath(256, 256, 132, 9, 6, 0));
document.getElementById('wave2').setAttribute('d', wavePath(256, 256, 132, 9, 6, Math.PI));
document.getElementById('caustic').setAttribute('d', wavePath(256, 256, 132, 5, 9, 2.1));

// ---- 卡片渲染 ----
const variants = [
  { gid: 'gridM', id: 'm1', name: 'M1 · 律动环', desc: '主环变成 56 根径向均衡器柱，高低随正弦起伏，颜色沿环青→紫→粉流转——和炫彩播放键同一套色彩语言。' },
  { gid: 'gridM', id: 'm2', name: 'M2 · 双波环', desc: '两条相位相反的正弦波环（青+粉）交叠缠绕，像两条声波在环上对冲，静图也有「正在播放」的动感。' },
  { gid: 'gridM', id: 'm3', name: 'M3 · 节拍断弧', desc: '圆环按节拍切成长短不一的断弧，青粉两轨错开 14°，像音频时间轴上的块状波形；外圈一圈刻度点收边。' },
  { gid: 'gridS', id: 's1', name: 'S1 · 水下折射', desc: '一道水面横过圆环：水上清晰、水下经湍流置换扭曲变淡——光线穿过水层的折射感。' },
  { gid: 'gridS', id: 's2', name: 'S2 · 半浸水面', desc: '浸泡感最强：环内蓄起半池水，播放键立于水面之上，水下那段环彻底化开。' },
  { gid: 'gridS', id: 's3', name: 'S3 · 气泡上浮', desc: '整只环微微失焦像隔着水看，一道焦散光纹缠绕环身，几颗气泡正向上浮。' },
];

const sizes = [64, 48, 32, 24, 16];
for (const v of variants) {
  const rowImgs = () => sizes.map(s =>
    `<svg width="${s}" height="${s}" style="border-radius:${Math.max(3, s * 0.22)}px"><use href="#${v.id}"/></svg>`
  ).join('');
  document.getElementById(v.gid).insertAdjacentHTML('beforeend', `
    <div class="card">
      <h2>${v.name}</h2>
      <p class="desc">${v.desc}</p>
      <div class="stage">
        <div class="big"><svg viewBox="0 0 512 512"><use href="#${v.id}"/></svg></div>
        <div class="sizes">
          <div class="row light"><span class="lbl">浅底</span>${rowImgs()}</div>
          <div class="row dark"><span class="lbl">深底</span>${rowImgs()}</div>
        </div>
      </div>
    </div>`);
}
</script>
