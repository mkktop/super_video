  ).join('');

    <div class="card">
      <h2>${v.name}</h2>
      <p class="desc">${v.desc}</p>
      <div class="stage">
        <div class="big"><svg viewBox="0 0 512 512"><use href="#${v.id}"/></svg></div>

          <div class="row light"><span class="lbl">浅底</span>${rowImgs()}</div>
          <div class="row dark"><span class="lbl">深底</span>${rowImgs()}</div>
        </div>
