<script>
const variants = [
  { id: 'iconA', name: 'A · 棱镜雨滴', desc: '深紫夜底 + 白色雨滴内含播放键，青色星光点出「增强」。语义：雨（品牌）× 播放（视频）× 提亮（超分）。' },
  { id: 'iconB', name: 'B · 像素升格', desc: '左侧模糊大色块经白色箭头升维为右上锐利的青品红星芒 —— 最直白地讲「低清变高清」这个故事。' },
  { id: 'iconC', name: 'C · 帧线 V2（现方案改良）', desc: '保留现有极光渐变与取景框基因，但四角分离、线条更挺拔，中心播放键加大，小尺寸辨识度显著提升。' },
  { id: 'iconD', name: 'D · 雨幕胶片', desc: '暖橙→品红落日底，白色胶片框 + 齿孔，框内斜雨丝与播放键。视频感最强，与冷色系竞品区隔明显。' },
  { id: 'iconE', name: 'E · 双帧升格', desc: '虚化旧帧在左下、清晰新帧在右上，一虚一实叠出「重建」意象；紫晶底 + 青色星光收尾。' },
  { id: 'iconF', name: 'F · 光圈聚焦', desc: '深海军蓝底上青环套粉弧，如镜头光圈对准中心播放键。最克制、最「专业工具」气质的一版。' },
];

const sizes = [64, 48, 32, 24, 16];
const grid = document.getElementById('grid');
for (const v of variants) {
  const rowImgs = bg => sizes.map(s =>
    `<svg width="${s}" height="${s}" style="border-radius:${Math.max(3, s * 0.22)}px"><use href="#${v.id}"/></svg>`
  ).join('') ;
  grid.insertAdjacentHTML('beforeend', `
    <div class="card">
      <h2>${v.name}</h2>
      <p class="desc">${v.desc}</p>
      <div class="stage">
        <div class="big"><svg viewBox="0 0 512 512"><use href="#${v.id}"/></svg></div>
        <div class="sizes">
          <div class="row light"><span class="lbl">浅底</span>${rowImgs('light')}</div>
          <div class="row dark"><span class="lbl">深底</span>${rowImgs('dark')}</div>
        </div>
      </div>
    </div>`);
}
</script>
