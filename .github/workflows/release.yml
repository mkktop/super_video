name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 后端依赖
        run: pip install -r backend/requirements.txt pyinstaller

      - name: 下载 ffmpeg/ffprobe 到 bin/（打进安装包）
        shell: pwsh
        run: |
          curl -L -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip
          Expand-Archive ff.zip -DestinationPath ff
          New-Item -ItemType Directory -Force bin | Out-Null
          Move-Item ff/ffmpeg-n8.1-latest-win64-gpl-8.1/bin/ffmpeg.exe bin/
          Move-Item ff/ffmpeg-n8.1-latest-win64-gpl-8.1/bin/ffprobe.exe bin/

      - name: PyInstaller 打 sidecar（bundled 模型随包）
        working-directory: backend
        run: pyinstaller sidecar.spec --noconfirm

      - name: 前端构建
        working-directory: app
        run: |
          pnpm install
          pnpm build

      - name: 打安装包并发布到 GitHub Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: 发布收敛（electron-builder 偶发双草稿/资产拆分）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $rels = gh api "repos/${{ github.repository }}/releases?per_page=20" | ConvertFrom-Json
          $same = @($rels | Where-Object { $_.tag_name -eq $tag })
          $keep = @($same | Where-Object { @($_.assets | Where-Object { $_.name -like "*setup.exe" }).Count -gt 0 })[0]
          if (-not $keep) { Write-Host "没有可收敛的 Release"; exit 0 }
          foreach ($r in $same) {
            if ($r.id -ne $keep.id) { gh api -X DELETE "repos/${{ github.repository }}/releases/$($r.id)" | Out-Null }
          }
          $have = @($keep.assets.name)
          $bm = "dist-app/super_video_${ver}_setup.exe.blockmap"
          if (($have -notcontains (Split-Path $bm -Leaf)) -and (Test-Path $bm)) {
            gh release upload $tag $bm --clobber
          }
          if ($keep.draft) { gh release edit $tag --draft=false --title $tag }

      - name: 模型资产同步到 models-v1 Release（注册表驱动，缺什么补什么）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create models-v1 --title "模型资产" --notes "应用内模型市场全部下载源" 2>$null
          $existing = gh release view models-v1 --json assets --jq '.assets[].name'
          # 注册表 url 指向 models-v1 且随仓库 bundled 的文件才需要同步；
          # CUGAN/RIFE/pth 等外部模型已上传过，仓库里没有副本，自然跳过
          $want = Get-ChildItem backend/sv/models/registry_json/*.json | ForEach-Object {
            (Get-Content $_ -Raw | ConvertFrom-Json).files | Where-Object { $_.url -match 'models-v1' } | ForEach-Object { $_.name }
          }
          foreach ($name in $want) {
            $p = "backend/sv/models/bundled/$name"
            if (-not (Test-Path $p)) { continue }
            if ($existing -contains $name) { Write-Host "已存在，跳过 $name"; continue }
            gh release upload models-v1 $p
            Write-Host "已上传 $name"
          }
