name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 后端依赖
        run: pip install -r backend/requirements.txt pyinstaller

      - name: 下载 ffmpeg/ffprobe 到 bin/（打进安装包）
        shell: pwsh
        run: |
          curl -L -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip
          Expand-Archive ff.zip -DestinationPath ff
          New-Item -ItemType Directory -Force bin | Out-Null
          Move-Item ff/ffmpeg-n8.1-latest-win64-gpl-8.1/bin/ffmpeg.exe bin/
          Move-Item ff/ffmpeg-n8.1-latest-win64-gpl-8.1/bin/ffprobe.exe bin/

      - name: PyInstaller 打 sidecar（bundled 模型随包）
        working-directory: backend
        run: pyinstaller sidecar.spec --noconfirm

      - name: 前端构建
        working-directory: app
        run: |
          pnpm install
          pnpm build

      - name: 打安装包并发布到 GitHub Release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: 模型资产上传到 models-v1 Release（供重装/旧版本下载）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create models-v1 --title "模型资产" --notes "x4plus 动态尺寸 ONNX" 2>$null
          gh release upload models-v1 backend/sv/models/bundled/RealESRGAN_x4plus_dyn.onnx --clobber
