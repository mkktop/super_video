name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # 版本号三方一致性：tag / app/package.json / backend sv/__init__.py 必须对齐。
      # 错位时产物名与 latest.yml 版本不符 → electron-updater 永远报"已是最新"，
      # 或主进程误判旧版实例反复杀端口重启（v0.2.3 审查发现的发布事故面）
      - name: 版本一致性校验
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $pkg = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $sv = (Select-String -Path backend/sv/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "tag=$tag package.json=$pkg sv=$sv"
          if ($tag -ne $pkg -or $tag -ne $sv) {
            Write-Host "::error::版本号不一致：tag=$tag package.json=$pkg sv/__init__.py=$sv（三处都改成同一版本再打 tag）"
            exit 1
          }

      - name: 后端依赖
        run: pip install -r backend/requirements.txt pyinstaller

      - name: 下载 ffmpeg/ffprobe 到 bin/（打进安装包）
        # n8.1 分支内滚动（BtbN 只保留最近 autobuild，硬 pin 具体 tag 会 404）；
        # 大版本锁在 8.1——升 9.x 前必须本地全量验证后再改这里的两处路径
        shell: pwsh
        run: |
          curl -L -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip
          Expand-Archive ff.zip -DestinationPath ff
          New-Item -ItemType Directory -Force bin | Out-Null
          Move-Item ff/ffmpeg-n8.1-latest-win64-gpl-8.1/bin/ffmpeg.exe bin/
          Move-Item ff/ffmpeg-n8.1-latest-win64-gpl-8.1/bin/ffprobe.exe bin/

      - name: 后端测试（发布门禁：未经测试的 commit 不得直接出安装包）
        working-directory: backend
        run: python -m pytest tests/ -q

      - name: PyInstaller 打 sidecar（bundled 模型随包）
        working-directory: backend
        run: pyinstaller sidecar.spec --noconfirm

      - name: sidecar 自检（缺库立即红，防 requirements 漂移打进坏包）
        working-directory: backend
        run: dist/sidecar/sidecar.exe selftest

      - name: 前端构建（类型检查 + 打包）
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          npx vue-tsc --noEmit -p tsconfig.json
          pnpm build

      - name: 打安装包（不发布，资产由 softprops 统一上传）
        working-directory: app
        run: npx electron-builder --win nsis --publish never

      # 预览版（tag 含 -preview.N）：Release 标记 prerelease——稳定通道客户端走
      # GitHub releases/latest 端点（天然排除 prerelease），靠这个标记才看不到预览版。
      # channel 文件说明：electron-builder 对 GitHub publish 不按版本号切换
      # （预览版也产 latest.yml）；预览通道客户端先请求 preview.yml，404 后自动
      # 回退 latest.yml（electron-updater 内建 fallback），显式只传 latest.yml
      # （*.yml 通配会把 builder-debug.yml 一并传上 Release，v0.4.0 实证已回滚）
      - name: 上传到 GitHub Release（正文取自仓库根 RELEASE_NOTES.md）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-preview.') }}
          body_path: RELEASE_NOTES.md
          files: |
            dist-app/*.exe
            dist-app/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传到 R2 备用源（GitHub 连通失败时客户端自动回退下载）
        # secrets 缺失（未配置备用源）时跳过，不阻塞发版；配置了 CLOUDFLARE_API_TOKEN
        # + CLOUDFLARE_ACCOUNT_ID 即生效。安装包按原名平铺不重名；与 GitHub Release
        # 同步同一次构建产物，sha512 跨源一致。通道文件按通道分名：正式版 latest.yml、
        # 预览版 preview.yml（内容即本次构建的 latest.yml 改名，exe 引用不变）——
        # 客户端 GenericProvider 按 updater.channel 取 {channel}.yml（预览通道主进程
        # 显式置 channel=preview，与本步骤同版生效），两通道各读各的互不越界：
        # 稳定兜底只会收到正式版，预览兜底也能收到预览版。同名通道文件逐版覆盖。
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if (-not $env:CF_TOKEN -or -not $env:CF_ACCOUNT) {
            Write-Host "R2 secrets 未配置（CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID），跳过备用源上传"
            exit 0
          }
          $ver = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $env:CLOUDFLARE_API_TOKEN = $env:CF_TOKEN
          $env:CLOUDFLARE_ACCOUNT_ID = $env:CF_ACCOUNT
          # wrangler 走 Cloudflare API，偶发 502（v0.4.3 实测 252MB exe 一次 502，
          # 且 pwsh 不因原生命令失败中断——latest.yml 已传 exe 没传，R2 进混合态
          # 而步骤末尾 $LASTEXITCODE 才暴露失败）。逐文件显式校验退出码 + 重试 3 次
          function Put-R2($key, $file) {
            for ($i = 1; $i -le 3; $i++) {
              npx --yes wrangler@4 r2 object put "super-video/$key" --file $file --remote
              if ($LASTEXITCODE -eq 0) { return }
              Write-Host "::warning::wrangler put $key 第 $i 次失败（exit=$LASTEXITCODE），重试"
              Start-Sleep -Seconds (10 * $i)
            }
            Write-Host "::error::wrangler put $key 三次均失败"
            exit 1
          }
          $isPreview = $env:GITHUB_REF_NAME -match '-preview\.'
          $channelYml = if ($isPreview) { "preview.yml" } else { "latest.yml" }
          if ($isPreview) { Copy-Item "dist-app/latest.yml" "dist-app/preview.yml" }
          Put-R2 $channelYml "dist-app/$channelYml"
          Put-R2 "super_video_${ver}_setup.exe" "dist-app/super_video_${ver}_setup.exe"
          Write-Host "R2 备用源已更新 $channelYml + super_video_${ver}_setup.exe"

      - name: 模型资产同步到 models-v1 Release（注册表驱动，缺什么补什么）
        # 仅 tag 发版时执行：workflow_dispatch 的 commit 上移动 models-v1 tag 是意外行为
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # notes 内容以仓库 backend/sv/models/ASSETS.md 为唯一事实源（页面已在线上，
          # 此 create 仅在 release 不存在时生效，2>$null 吞掉已存在报错）
          gh release create models-v1 --title "模型资产" --notes-file backend/sv/models/ASSETS.md 2>$null
          $existing = gh release view models-v1 --json assets --jq '.assets[].name'
          # 注册表 url 指向 models-v1 且随仓库 bundled 的文件才需要同步；
          # CUGAN/RIFE/pth 等外部模型已上传过，仓库里没有副本，自然跳过
          $want = Get-ChildItem backend/sv/models/registry_json/*.json | ForEach-Object {
            (Get-Content $_ -Raw | ConvertFrom-Json).files | Where-Object { $_.url -match 'models-v1' } | ForEach-Object { $_.name }
          }
          foreach ($name in $want) {
            $p = "backend/sv/models/bundled/$name"
            if (-not (Test-Path $p)) { continue }
            if ($existing -contains $name) { Write-Host "已存在，跳过 $name"; continue }
            gh release upload models-v1 $p
            Write-Host "已上传 $name"
          }

      - name: 同步缺失资产到 ModelScope 镜像（国内主源，注册表对账）
        # 跟在 models-v1 同步之后：脚本按「远端已有同名同大小则跳过」对账，
        # 平常发版零上传秒级完成，只有注册表新增/远端缺失时才传
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          if (-not $env:MODELSCOPE_TOKEN) {
            Write-Host "MODELSCOPE_TOKEN 未配置，跳过 ModelScope 镜像同步"
            exit 0
          }
          pip install modelscope
          python .github/scripts/sync_modelscope.py --readme
